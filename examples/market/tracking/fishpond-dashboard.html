<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>鱼塘长期跟踪</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f7f9;
      --panel: #ffffff;
      --panel-soft: #f0f3f7;
      --text: #1f2933;
      --muted: #667085;
      --line: #d9dee7;
      --blue: #2563eb;
      --green: #0f8b4c;
      --amber: #b7791f;
      --red: #c2413a;
      --violet: #6d5bd0;
      --shadow: 0 8px 24px rgba(31, 41, 51, 0.08);
      font-family: "Microsoft YaHei", "PingFang SC", Arial, sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: #111827;
      color: #fff;
      padding: 22px 28px;
      border-bottom: 4px solid #d33f2f;
    }

    header h1 {
      margin: 0;
      font-size: 26px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    header p {
      margin: 8px 0 0;
      color: #cbd5e1;
      font-size: 14px;
    }

    main {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      gap: 18px;
      padding: 18px;
      max-width: 1480px;
      margin: 0 auto;
    }

    aside,
    section {
      background: var(--panel);
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      border-radius: 8px;
    }

    aside {
      padding: 14px;
      align-self: start;
      position: sticky;
      top: 12px;
    }

    .toolbar {
      display: grid;
      gap: 10px;
      margin-bottom: 14px;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 11px;
      font-size: 14px;
      background: #fff;
      color: var(--text);
    }

    .pond-list {
      display: grid;
      gap: 8px;
    }

    .pond-button {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 6px;
      padding: 10px;
      text-align: left;
      cursor: pointer;
      color: var(--text);
    }

    .pond-button.active {
      border-color: var(--blue);
      background: #eff6ff;
    }

    .pond-title {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
      font-weight: 700;
      font-size: 14px;
    }

    .pond-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 12px;
    }

    .content {
      display: grid;
      gap: 18px;
    }

    .summary {
      padding: 18px;
    }

    .summary-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      margin-bottom: 14px;
    }

    h2 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    h3 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .tag {
      display: inline-flex;
      align-items: center;
      border-radius: 999px;
      padding: 4px 9px;
      font-size: 12px;
      font-weight: 700;
      border: 1px solid transparent;
      white-space: nowrap;
    }

    .rich { background: #e7f8ef; color: var(--green); border-color: #b7e3ca; }
    .active-tag { background: #eff6ff; color: var(--blue); border-color: #bfdbfe; }
    .watch { background: #fff7e6; color: var(--amber); border-color: #f3d38b; }
    .poor { background: #fff0ef; color: var(--red); border-color: #f3bbb6; }
    .keep { background: #e8f7ee; color: var(--green); }
    .probation { background: #f1edff; color: var(--violet); }
    .downgrade { background: #fff4df; color: var(--amber); }
    .remove { background: #fff0ef; color: var(--red); }

    .metrics {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .metric {
      background: var(--panel-soft);
      border-radius: 8px;
      padding: 11px;
      min-height: 74px;
    }

    .metric strong {
      display: block;
      font-size: 20px;
      margin-bottom: 4px;
    }

    .metric span {
      color: var(--muted);
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .panel {
      padding: 16px;
    }

    .table-wrap {
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 980px;
      background: #fff;
    }

    th,
    td {
      border-bottom: 1px solid var(--line);
      padding: 10px;
      text-align: left;
      vertical-align: top;
      font-size: 13px;
    }

    th {
      background: #f8fafc;
      color: #334155;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    tr:last-child td { border-bottom: 0; }

    .code {
      font-family: Consolas, "Courier New", monospace;
      color: #475569;
      white-space: nowrap;
    }

    .note-list {
      margin: 0;
      padding-left: 18px;
      color: #344054;
      line-height: 1.65;
      font-size: 14px;
    }

    .empty {
      padding: 28px;
      text-align: center;
      color: var(--muted);
    }

    @media (max-width: 980px) {
      main {
        grid-template-columns: 1fr;
        padding: 12px;
      }

      aside {
        position: static;
      }

      .metrics,
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

      </section>

      <div class="grid">

        </section>
        <section class="panel">
          <h3>触发与失效</h3>
          <ul id="ruleList" class="note-list"></ul>
        </section>
      </div>

      <section class="panel">

        <div class="table-wrap">

                <th>逻辑</th>
                <th>触发</th>
                <th>失效</th>
              </tr>
            </thead>
            <tbody id="stockTable"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

      }
    ];

    const classForStatus = (status) => {
      if (status === "富矿池") return "rich";
      if (status === "活跃池") return "active-tag";
      if (status === "观察池") return "watch";
      if (status === "贫瘠池") return "poor";
      if (status === "保留") return "keep";
      if (status === "观察期") return "probation";
      if (status === "降级") return "downgrade";
      if (status === "剔除") return "remove";
      return "active-tag";
    };

    const state = {
      selected: ponds[0].id,
      search: "",
      status: "all"
    };

    const els = {
      searchInput: document.getElementById("searchInput"),
      statusFilter: document.getElementById("statusFilter"),
      pondList: document.getElementById("pondList"),
      pondName: document.getElementById("pondName"),
      pondThesis: document.getElementById("pondThesis"),
      pondTags: document.getElementById("pondTags"),
      metricStatus: document.getElementById("metricStatus"),
      metricCore: document.getElementById("metricCore"),
      metricStocks: document.getElementById("metricStocks"),
      metricNext: document.getElementById("metricNext"),
      eventList: document.getElementById("eventList"),
      ruleList: document.getElementById("ruleList"),
      stockTable: document.getElementById("stockTable")
    };

    function matchesSearch(pond) {
      const q = state.search.trim().toLowerCase();
      if (!q) return true;
      const haystack = [
        pond.name,
        pond.status,
        pond.thesis,
        ...pond.core,
        ...pond.tags,
        ...pond.stocks.flat()
      ].join(" ").toLowerCase();
      return haystack.includes(q);
    }

    function filteredPonds() {
      return ponds.filter((pond) => {
        const statusOk = state.status === "all" || pond.status === state.status;
        return statusOk && matchesSearch(pond);
      });
    }

    function renderPondList() {
      const list = filteredPonds();
      if (!list.length) {
        els.pondList.innerHTML = '<div class="empty">没有匹配的鱼塘</div>';
        return;
      }
      if (!list.some((pond) => pond.id === state.selected)) {
        state.selected = list[0].id;
      }
      els.pondList.innerHTML = list.map((pond) => `
        <button class="pond-button ${pond.id === state.selected ? "active" : ""}" data-id="${pond.id}">
          <div class="pond-title">
            <span>${pond.name}</span>
            <span class="tag ${classForStatus(pond.status)}">${pond.status}</span>
          </div>
          <div class="pond-meta">${pond.core.join(" / ")}</div>
        </button>
      `).join("");
      els.pondList.querySelectorAll("button").forEach((button) => {
        button.addEventListener("click", () => {
          state.selected = button.dataset.id;
          render();
        });
      });
    }

    function renderSelectedPond() {
      const pond = ponds.find((item) => item.id === state.selected) || filteredPonds()[0] || ponds[0];
      els.pondName.textContent = pond.name;
      els.pondThesis.textContent = pond.thesis;
      els.pondTags.innerHTML = [
        `<span class="tag ${classForStatus(pond.status)}">${pond.status}</span>`,
        ...pond.tags.map((tag) => `<span class="tag active-tag">${tag}</span>`)
      ].join("");
      els.metricStatus.textContent = pond.status;
      els.metricCore.textContent = pond.core.length;
      els.metricStocks.textContent = pond.stocks.length;
      els.metricNext.textContent = pond.nextCheck;
      els.eventList.innerHTML = pond.events.map((event) => `<li>${event}</li>`).join("");
      els.ruleList.innerHTML = pond.rules.map((rule) => `<li>${rule}</li>`).join("");
      els.stockTable.innerHTML = pond.stocks.map((stock) => `
        <tr>
          <td>${stock[0]}</td>
          <td class="code">${stock[1]}</td>
          <td><strong>${stock[2]}</strong></td>
          <td><span class="tag ${classForStatus(stock[3])}">${stock[3]}</span></td>
          <td>${stock[4]}</td>
          <td>${stock[5]}</td>
          <td>${stock[6]}</td>
        </tr>
      `).join("");
    }

    function render() {
      renderPondList();
      renderSelectedPond();
    }

    els.searchInput.addEventListener("input", (event) => {
      state.search = event.target.value;
      render();
    });

    els.statusFilter.addEventListener("change", (event) => {
      state.status = event.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
